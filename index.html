<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>حجز موعد عيادة الأسنان</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <h1>حجز موعد عيادة الأسنان</h1>
    <p class="subtitle">يرجى ملء البيانات التالية لحجز موعدك</p>

    <div class="alert important">
      <span class="emoji">⚠️</span> <strong>مهم جدًا:</strong>
      <p>العيادة لا تعمل أيام:</p>
      <ul>
        <li>الجمعة</li>
        <li>السبت</li>
      </ul>
    </div>

    <div class="alert hours">
      <span class="emoji">🕒</span> <strong>أوقات العمل:</strong>
      <p>من الأحد إلى الخميس</p>
      <p>من 09:00 صباحًا إلى 16:00 مساءً</p>
    </div>

    <p class="note">يرجى اختيار يوم عمل حتى يتم حجز موعدك بنجاح.</p>

    <form id="appointment-form">
      
      <div class="form-group">
        <label for="full-name">اسم المريض الكامل (اللقب والاسم) <span class="required">*</span></label>
        <input 
          type="text" 
          id="full-name" 
          name="fullName" 
          placeholder="ادخل الاسم أولاً ثم اللقب" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="phone">رقم الهاتف <span class="required">*</span></label>
        <input 
          type="tel" 
          id="phone" 
          name="phone" 
          placeholder="أدخل رقم الهاتف" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="day">اليوم المطلوب <span class="required">*</span></label>
        <select id="day" name="day" required>
          <option value="">اختر اليوم...</option>
          <option value="الأحد">الأحد</option>
          <option value="الإثنين">الإثنين</option>
          <option value="الثلاثاء">الثلاثاء</option>
          <option value="الأربعاء">الأربعاء</option>
          <option value="الخميس">الخميس</option>
        </select>
      </div>

      <div class="form-group radio-group">
        <label>الفترة <span class="required">*</span></label>
        <label>
          <input type="radio" name="period" value="صباحية" required />
          الصباحية (AM)
        </label>
        <label>
          <input type="radio" name="period" value="مسائية" />
          المسائية (PM)
        </label>
      </div>

      <button type="submit" class="submit-btn">حجز الموعد</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>é
